name: manage-ai

services:
  web:
    build: .
    image: manage-ai:dev
    container_name: manage-ai
    restart: unless-stopped
    ports:
      - "5100:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/workspace/logs/manage-ai:/var/log/manage-ai
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok||r.status===302?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - manage-ai

networks:
  manage-ai:
    driver: bridge
